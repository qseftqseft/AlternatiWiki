<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <title>wwAPI</title>
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    
</head>
<body>
    <h1 class="qheader"><a href="index.html" class="nostyle">AlternatiWiki</a></h1>
    <main>
        <h2>Settings</h2>
        <section>
            <div>
                <h3>Presets</h3>
                <button id="theme-default">Default</button>
                <button id="theme-light">Light</button>
                <button id="theme-dark">Dark</button>
            </div>
            <div>
                <h3>Background Color</h3>
                <input id="bgcolor" type="color" value="#000000"/>
            </div>
            <div>
                <h3>Font</h3>
                <select id="font">
                  <option value="monospace">monospace</option>
                  <option value="Arial">Arial</option>
                  <option value="Verdana">Verdana</option>
                  <option value="Tahoma">Tahoma</option>
                  <option value="Trebuchet MS">Trebuchet MS</option>
                  <option value="Times New Roman">Times New Roman</option>
                  <option value="Georgia">Georgia</option>
                  <option value="Garamond">Garamond</option>
                  <option value="Courier New">Courier New</option>
                  <option value="Brush Script MT">Brush Script MT</option>
                  <option value="sans-serif">sans-serif</option>
                  <option value="serif">serif</option>
                  <option value="cursive">cursive</option>
                </select>
            </div>
            <div>
                <h3>Text Size</h3>
                <input type="text" id="fontsize" value="150%"/>
            </div>
            <div>
                <h3>Text Color</h3>
                <input type="color" id="fgcolor" value="#ffffff"/>
            </div>
            <div>
                <h3>Notice BG opacity</h3>
                <input type="range" min="0" max="255" step="1" id="noticesbgcolor" value="25"/>
            </div>
            <div>
                <h3>Table darken/lighten</h3>
                <input type="number" id="shading" value="-25"/>
            </div>
            <div>
                <h3>Apply</h3>
                <button id="apply">Apply</button>
            </div>
            
        </section>
    </main>
    
    <script src="settingsGet.js"></script>
    <script src="settings.js"></script>
    
</body>
</html>
